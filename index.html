<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Santa's List</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Santa's List">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13462d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Santa%27s%20List%22%2C%20%22short_name%22%3A%20%22Santa%27s%20List%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%2313462d%22%2C%20%22theme_color%22%3A%20%22%2313462d%22%2C%20%22start_url%22%3A%20%22./%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22apple-touch-icon.png%22%2C%20%22sizes%22%3A%20%22180x180%22%2C%20%22type%22%3A%20%22image/png%22%7D%5D%7D">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%} [hidden]{display:none!important}
html{background:#13462d}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: green header band with Santa's cookie table, candy-cane progress, then one card per person (2 cols when wide) */
:root{
  --bg:#f2f6f1; --paper:#ffffff; --ink:#1c2a21; --muted:#5a6b60; --line:#d5e0d7;
  --red:#c8102e; --red-ink:#ffffff; --green:#1d6a42; --gold:#c9951a;
  --hdr:#13462d; --hdr-ink:#f7fbf7; --hdr-soft:#a9cdb6; --stripe:#ffffff;
  --skin:#f3caa9; --beard:#ffffff; --cookie:#cf8f4f; --chip:#4a2b16; --plate:#f4f1ec;
  --shadow:0 1px 2px rgba(20,50,30,.08),0 6px 18px rgba(20,50,30,.06);
  --display:"Berkshire Swash",Georgia,"Times New Roman",serif;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a13; --paper:#152a1e; --ink:#edf3ee; --muted:#9db2a5; --line:#28402f;
  --red:#e23a4f; --red-ink:#ffffff; --green:#45ad74; --gold:#e7b63c;
  --hdr:#0a2b1b; --hdr-ink:#f2f8f3; --hdr-soft:#8fbba0; --stripe:#f7f2f2;
  --plate:#e9e4dc; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a13; --paper:#152a1e; --ink:#edf3ee; --muted:#9db2a5; --line:#28402f;
  --red:#e23a4f; --red-ink:#ffffff; --green:#45ad74; --gold:#e7b63c;
  --hdr:#0a2b1b; --hdr-ink:#f2f8f3; --hdr-soft:#8fbba0; --stripe:#f7f2f2;
  --plate:#e9e4dc; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{background:var(--hdr);color:var(--hdr-ink);position:relative;overflow:hidden}
header .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:6px}
.snow{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle,var(--hdr-ink) 1.2px,transparent 1.6px),radial-gradient(circle,var(--hdr-ink) .8px,transparent 1.2px);
  background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;animation:snow 14s linear infinite}
@keyframes snow{to{background-position:0 460px,13px 307px}}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--hdr-soft);margin-bottom:4px}
.cane{width:84px;height:84px;flex:none}
.scene{position:relative;width:100%;max-width:440px;align-self:center}
.scene svg{display:block;width:100%;height:auto}
.caption{position:relative;text-align:center;font-weight:700;color:var(--hdr-soft);font-size:15px;padding-bottom:16px;min-height:2.6em;text-wrap:balance}

/* Progress */
.progress{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 18px;margin-top:-6px;position:relative;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:26px;line-height:1;color:var(--red)}
.pmeta{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:relative;height:22px;border-radius:11px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:9px;transition:width .6s cubic-bezier(.3,1.3,.5,1);
  background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--stripe) 10px 20px);background-size:28.3px 28.3px;animation:march 1.2s linear infinite}
@keyframes march{to{background-position:28.3px 0}}
.bar.full .fill{background:repeating-linear-gradient(-45deg,var(--green) 0 10px,var(--stripe) 10px 20px);background-size:28.3px 28.3px}

/* Sections */
main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--green);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--red) 0 6px,transparent 6px 12px);opacity:.55}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.section{display:flex;flex-direction:column;gap:12px}

.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border:2px solid transparent;transition:border-color .3s}
.card.done{border-color:var(--green)}
.chead{display:flex;align-items:center;gap:8px}
.cname{font-family:var(--display);font-size:24px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.count{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red-ink);padding:3px 9px;border-radius:999px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 7px,#e0596b 7px 14px);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pill.wait{background:var(--bg);color:var(--muted);text-shadow:none;border:1px solid var(--line)}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .2s}
.check[aria-checked="true"]{border-color:var(--red);background:repeating-linear-gradient(-45deg,var(--red) 0 5px,#e0596b 5px 10px)}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.check:active{transform:scale(.9)}
.gtext{flex:1;min-width:0;overflow-wrap:anywhere}
.icons{flex:none;display:flex;gap:1px;margin-left:-4px}
.ib{--hole:var(--paper);width:32px;height:34px;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:transform .15s}
.ib svg{width:26px;height:26px;overflow:visible}
.ib:active{transform:scale(.86)}
.ib.just{animation:ibpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes ibpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:22px;height:22px;overflow:visible}
li.got .gtext{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--muted)}
.yearly{flex:none;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;cursor:pointer;
  border:1px dashed var(--line);background:transparent;color:var(--muted)}
.yearly[aria-pressed="true"]{border:1px solid var(--gold);color:var(--gold)}
.x{flex:none;width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;border-radius:8px}
.x:hover{color:var(--red);background:var(--bg)}
.empty{color:var(--muted);font-size:14px;font-style:italic;padding:4px 0}

.add{display:flex;gap:8px}
.add input,.addp input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.add input:focus,.addp input:focus{outline:none;border-color:var(--green)}
.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--green);color:#fff}
.btn.red{background:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rm{align-self:flex-end;font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;cursor:pointer;padding:2px 0;text-decoration:underline}
.addp{display:flex;gap:8px;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:12px}

/* Alternating red / green cards (checkerboard when two columns) */
:root{--card-red:#b8112c;--card-red-2:#d23048;--card-green:#1a6140;--card-green-2:#2a7d55;--on-card:#ffffff;--on-card-soft:rgba(255,255,255,.72);--on-card-line:rgba(255,255,255,.3)}
.grid .card{--cbg:var(--card-red);--cbg2:var(--card-red-2);color:var(--on-card);border:0;position:relative;overflow:hidden;
  background:radial-gradient(circle at 92% 8%,var(--cbg2) 0 46px,transparent 47px),var(--cbg);padding-top:20px}
.grid .card::before{content:"";position:absolute;inset:0 0 auto;height:8px;
  background:repeating-linear-gradient(-45deg,#ffffff 0 8px,var(--cbg2) 8px 16px)}
.grid .card:nth-child(even){--cbg:var(--card-green);--cbg2:var(--card-green-2)}
@media (min-width:640px){
  .grid .card:nth-child(4n+3){--cbg:var(--card-green);--cbg2:var(--card-green-2)}
  .grid .card:nth-child(4n+4){--cbg:var(--card-red);--cbg2:var(--card-red-2)}
}
.grid .card.done{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.grid .card .count,.grid .card .gtext{color:var(--on-card)}
.grid .card .count{color:var(--on-card-soft)}
.grid .card li{border-bottom-color:var(--on-card-line)}
.grid .card li.got .gtext{color:var(--on-card-soft);text-decoration-color:#ffffff}
.grid .card .empty,.grid .card .rm{color:var(--on-card-soft)}
.grid .card .check{background:transparent;border-color:rgba(255,255,255,.75)}
.grid .card .check[aria-checked="true"]{border-color:#ffffff;background:#ffffff}
.grid .card .check[aria-checked="true"] path{stroke:var(--cbg)}
.grid .card .ib{--hole:var(--cbg);color:rgba(255,255,255,.85)}
.grid .card .yearly{color:var(--on-card-soft);border-color:var(--on-card-line)}
.grid .card .yearly[aria-pressed="true"]{color:#ffe08a;border-color:#ffe08a}
.grid .card .x{color:var(--on-card-soft)}
.grid .card .x:hover{color:#ffffff;background:rgba(255,255,255,.15)}
.grid .card .pill{background:#ffe08a;color:#3a2a00;text-shadow:none}
.coalbtn{flex:none;width:34px;height:34px;padding:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:10px;color:rgba(255,255,255,.75);transition:transform .15s}
.coalbtn svg{width:26px;height:26px;overflow:visible}
.coalbtn:active{transform:scale(.86)}
.grid .card.naughty{--cbg:#2c2c31;--cbg2:#3b3b42;box-shadow:var(--shadow)}
.card.naughty .cname{color:#d6d6dc}
.card.naughty li{opacity:.4;filter:grayscale(1)}
.card.naughty li button{pointer-events:none}
.card.naughty .gtext{text-decoration:none}
.grid .card .pill.naughty,.pill.naughty{background:#d5122f;color:#ffffff;border:1px solid #ff6b7d;display:inline-flex;align-items:center;gap:5px}
.pill.naughty svg{width:15px;height:15px}
.card.naughty .chead .coal-big{animation:thud .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes thud{0%{transform:translateY(-24px) scale(.5);opacity:0}60%{transform:translateY(2px) scale(1.15,.85);opacity:1}100%{transform:none}}
.coal{transform-box:fill-box;transform-origin:50% 100%}
.coal.new{animation:presIn .8s cubic-bezier(.3,1.2,.5,1)}
.grid .card .add input{background:rgba(255,255,255,.14);border-color:var(--on-card-line);color:var(--on-card)}
.grid .card .add input::placeholder{color:var(--on-card-soft)}
.grid .card .add input:focus{border-color:#ffffff}
.grid .card .btn{background:#ffffff;color:var(--cbg)}
.grid .card .btn.ghost{background:transparent;color:#ffffff;border-color:var(--on-card-line)}
.grid .card .btn.red{background:#ffe08a;color:#3a2a00}

.reset{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:2px dashed var(--line);padding-top:18px;font-size:14px;color:var(--muted)}
.reset .row{display:flex;gap:8px;flex-wrap:wrap}
.loading{color:var(--muted);text-align:center;padding:30px 0;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--hdr);color:var(--hdr-ink);
  padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}

/* Tree */
#tree .bulb{transition:fill .5s}
#tree .bglow{opacity:0;transition:opacity .6s}
#tree{overflow:visible}
#tree.lit .bglow{opacity:.45;animation:twk 1.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes twk{50%{opacity:.12}}
#halo{opacity:0;transition:opacity 1s;transform-box:fill-box;transform-origin:center}
#tree.lit #halo{opacity:1;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.2)}}
#star{fill:#7d7442;stroke:#b8a75a;stroke-width:1;transition:fill .6s;transform-box:fill-box;transform-origin:center}
#tree.lit #star{fill:#ffd23f;stroke:#fff3b0;animation:starspin 3s ease-in-out infinite}
@keyframes starspin{50%{transform:scale(1.15) rotate(8deg)}}
#tiers{transform-box:view-box;transform-origin:170px 200px}
#tree.sway #tiers{animation:sway .9s ease-in-out}
@keyframes sway{25%{transform:rotate(-2.2deg)}60%{transform:rotate(1.8deg)}}
.orn,.cane,.pres{transform-box:fill-box}
.orn.new{transform-origin:50% 0;animation:ornIn .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes ornIn{0%{transform:translateY(-46px) scale(.3);opacity:0}55%{opacity:1}100%{transform:none}}
.cane.new{transform-origin:50% 0;animation:caneIn 1s ease-out}
@keyframes caneIn{0%{transform:translateY(-30px) rotate(-60deg);opacity:0}45%{transform:rotate(25deg);opacity:1}70%{transform:rotate(-12deg)}85%{transform:rotate(5deg)}100%{transform:none}}
.pres.new{transform-origin:50% 100%;animation:presIn .8s cubic-bezier(.3,1.2,.5,1)}
@keyframes presIn{0%{transform:translateY(-60px);opacity:0}50%{transform:translateY(0) scale(1.15,.8);opacity:1}75%{transform:scale(.95,1.06)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.snow,.fill,#tree .bulb,#tree .bglow,#halo,#star,.orn,.cane,.pres,#tiers,.ib{animation:none!important}}
</style>
</head>
<body>


<header>
  <div class="snow"></div>
  <div class="wrap">
    <div class="titlerow">
      <h1><small>Katharine's Christmas shopping</small>Santa's List</h1>
      <svg class="cane" viewBox="0 0 90 90" aria-hidden="true">
        <defs>
          <pattern id="caneStripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
            <rect width="9" height="9" fill="#ffffff"/>
            <rect width="4" height="9" fill="#d5122f"/>
          </pattern>
          <g id="oneCane">
            <path d="M0 34 V-24 a11 11 0 0 1 22 0 v6" fill="none" stroke="#7a0c1d" stroke-width="11" stroke-linecap="round" opacity=".35"/>
            <path d="M0 34 V-24 a11 11 0 0 1 22 0 v6" fill="none" stroke="url(#caneStripe)" stroke-width="9" stroke-linecap="round"/>
            <path d="M-2 30 V-24 a13 13 0 0 1 6 -10" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
          </g>
        </defs>
        <use href="#oneCane" transform="translate(45 50) rotate(-24) scale(-1 1)"/>
        <use href="#oneCane" transform="translate(45 50) rotate(24)"/>
        <g transform="translate(45 52)">
          <path d="M0 0 L-13 -8 Q-16 0 -13 8 Z" fill="#2f9a5f"/>
          <path d="M0 0 L13 -8 Q16 0 13 8 Z" fill="#2f9a5f"/>
          <path d="M-1 2 L-6 14 M1 2 L6 14" stroke="#2f9a5f" stroke-width="3" stroke-linecap="round"/>
          <circle r="4" fill="#e7b63c"/>
        </g>
      </svg>
    </div>
    <div class="scene">
      <svg id="tree" viewBox="0 0 340 230" role="img" aria-label="Christmas tree that fills with ornaments, candy canes and presents">
        <defs>
          <radialGradient id="starGlow"><stop offset="0" stop-color="#ffe680" stop-opacity=".85"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
          <pattern id="tcane" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
            <rect width="3.2" height="3.2" fill="#ffffff"/><rect width="1.5" height="3.2" fill="#d5122f"/>
          </pattern>
          <pattern id="icane" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
            <rect width="4" height="4" fill="#ffffff"/><rect width="1.9" height="4" fill="#d5122f"/>
          </pattern>
        </defs>
        <ellipse cx="170" cy="221" rx="160" ry="11" fill="#eef5f0" opacity=".9"/>
        <circle id="halo" cx="170" cy="24" r="42" fill="url(#starGlow)"/>
        <g id="tiers">
          <rect x="160" y="178" width="20" height="30" rx="2" fill="#6b4226"/>
          <path d="M170 92 L272 186 Q170 197 68 186 Z" fill="#1f7a48"/>
          <path d="M170 92 L272 186 Q222 193 170 194 Z" fill="#000" opacity=".12"/>
          <path d="M170 54 L246 136 Q170 147 94 136 Z" fill="#26904f"/>
          <path d="M170 54 L246 136 Q210 143 170 144 Z" fill="#000" opacity=".12"/>
          <path d="M170 20 L218 90 Q170 100 122 90 Z" fill="#2ea35c"/>
          <path d="M170 20 L218 90 Q196 96 170 98 Z" fill="#000" opacity=".12"/>
          <g id="wires" fill="none" stroke="#0c3320" stroke-width="1.1"></g>
          <g id="bulbs"></g>
          <g id="orns"></g>
          <g id="canes"></g>
        </g>
        <g id="presents"></g>
        <g id="coal"></g>
        <polygon id="star" points=""/>
      </svg>
    </div>
    <div class="caption" id="caption" aria-live="polite">Decorating the tree…</div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="progress" aria-label="Shopping progress">
      <div class="prow"><span class="big" id="pct">0%</span><span class="pmeta" id="pgifts">0 gifts</span></div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
      <div class="legend" id="legend"></div>
      <div class="pmeta" id="ppeople">0 of 0 people done</div>
    </section>
    <div id="lists"><div class="loading">Loading your list…</div></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const FAMILY_ORDER = ["Mom","Dad","Kim","Andy","Alice","KC","Kris","Jo","Nathan"];
  let state = {people:[]};
  let ref = null, localMode = false, loaded = false;
  let writing = false, dirty = false;
  const confirmRemove = new Set();
  let confirmReset = false;
  let justTapped = "", justCoal = "";
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2,10);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const STEPS = [["ordered","Ordered"],["received","Received"],["wrapped","Wrapped"]];
  function normalize(){
    state.people.forEach(p => p.gifts.forEach(g => {
      if(g.ordered === undefined){ g.ordered = !!g.done; g.received = false; g.wrapped = false; }
      g.done = !!g.wrapped;
    }));
  }
  const isDone = p => p.gifts.length > 0 && p.gifts.every(g => g.wrapped);
  const allDone = () => { const gs = state.people.filter(p => !p.naughty).flatMap(p => p.gifts); return gs.length > 0 && gs.every(g => g.wrapped); };
  const find = id => state.people.find(p => p.id === id);

  // ---------- saving ----------
  function save(){
    if(localMode){ try{ localStorage.setItem("xmasList", JSON.stringify(state)); }catch(e){} return; }
    if(!ref) return;
    dirty = true;
    if(!writing) flush();
  }
  async function flush(){
    writing = true;
    while(dirty){
      dirty = false;
      try{ await ref.set(JSON.parse(JSON.stringify(state))); }
      catch(e){ toast("Couldn't save that change. Check your connection and try again."); break; }
    }
    writing = false;
  }

  // ---------- rendering ----------
  // ---------- icons (outline until checked, then filled) ----------
  const ICON = {
    ordered(on){ // ornament
      return on
        ? `<svg viewBox="0 0 28 28"><circle cx="14" cy="3.2" r="1.7" fill="none" stroke="#c9c9c9" stroke-width="1.4"/><rect x="11.2" y="4.6" width="5.6" height="4" rx="1" fill="#d9d9d9" stroke="rgba(0,0,0,.25)" stroke-width=".8"/><circle cx="14" cy="17.2" r="9.2" fill="#f2c14e" stroke="rgba(0,0,0,.25)" stroke-width=".9"/><path d="M5.6 15.5 Q14 19 22.4 15.5" fill="none" stroke="#d5122f" stroke-width="2"/><circle cx="10.6" cy="13.4" r="2.2" fill="#fff" opacity=".7"/></svg>`
        : `<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="14" cy="3.2" r="1.6"/><rect x="11.2" y="4.8" width="5.6" height="3.6" rx="1"/><circle cx="14" cy="17.2" r="8.8"/></svg>`;
    },
    received(on){ // candy cane
      const d = "M17.5 26 V10 a5.2 5.2 0 0 0 -10.4 0 v2.6";
      return on
        ? `<svg viewBox="0 0 28 28" fill="none" stroke-linecap="round"><path d="${d}" stroke="rgba(0,0,0,.28)" stroke-width="7.4"/><path d="${d}" stroke="url(#icane)" stroke-width="6"/></svg>`
        : `<svg viewBox="0 0 28 28" fill="none" stroke-linecap="round"><path d="${d}" stroke="currentColor" stroke-width="7.2"/><path d="${d}" stroke="var(--hole)" stroke-width="3.6"/></svg>`;
    },
    wrapped(on){ // present
      return on
        ? `<svg viewBox="0 0 28 28"><rect x="5" y="12.5" width="18" height="12.5" rx="1.5" fill="#ffffff" stroke="rgba(0,0,0,.25)" stroke-width=".9"/><rect x="4" y="9" width="20" height="4.6" rx="1" fill="#ffffff" stroke="rgba(0,0,0,.25)" stroke-width=".9"/><rect x="12.4" y="9" width="3.2" height="16" fill="#d5122f"/><path d="M14 9 C10 3 5.5 5.5 9.4 9 Z M14 9 C18 3 22.5 5.5 18.6 9 Z" fill="#f2c14e" stroke="rgba(0,0,0,.25)" stroke-width=".8"/></svg>`
        : `<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="13" width="18" height="12" rx="1.5"/><rect x="4" y="9" width="20" height="4" rx="1"/><path d="M14 9 V25"/><path d="M14 9 C10 3 5.5 5.5 9.4 9 M14 9 C18 3 22.5 5.5 18.6 9"/></svg>`;
    }
  };
  const LABEL = {ordered:"Ordered", received:"Received", wrapped:"Wrapped"};

  // ---------- tree ----------
  const tree = $("tree");
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const TIERS = [[20,90,48],[54,136,76],[92,186,102]]; // apex y, base y, half-width at base
  const inside = (x,y,m) => TIERS.some(([a,b,w]) => y > a+8 && y < b-6 && Math.abs(x-170) < (y-a)/(b-a)*w - m);
  // star
  (function(){ const pts=[]; for(let i=0;i<10;i++){ const r = i%2 ? 5.6 : 13.5, a = -Math.PI/2 + i*Math.PI/5; pts.push((170+r*Math.cos(a)).toFixed(1)+","+(24+r*Math.sin(a)).toFixed(1)); } $("star").setAttribute("points", pts.join(" ")); })();
  // garland + bulbs
  const BULB_COLORS = ["#ff4d5e","#ffd23f","#4cc3ff","#7dff8a","#ff8de1"];
  const bulbPts = [];
  (function(){
    const curves = [[[140,64],[170,86],[202,72],6],[[110,110],[170,140],[234,118],9],[[86,156],[170,196],[260,164],12]];
    let wires = "", bulbs = "", k = 0;
    curves.forEach(([p0,c,p2,n]) => {
      wires += `<path d="M${p0[0]} ${p0[1]} Q${c[0]} ${c[1]} ${p2[0]} ${p2[1]}"/>`;
      for(let i=0;i<n;i++){
        const t = .05 + .9*i/(n-1), u = 1-t;
        const x = u*u*p0[0] + 2*u*t*c[0] + t*t*p2[0], y = u*u*p0[1] + 2*u*t*c[1] + t*t*p2[1];
        bulbPts.push([x,y]); const col = BULB_COLORS[k++ % BULB_COLORS.length], d = (k*0.37 % 1.6).toFixed(2);
        bulbs += `<g style="--d:-${d}s"><circle class="bglow" cx="${x.toFixed(1)}" cy="${(y+2).toFixed(1)}" r="5.5" fill="${col}"/><circle class="bulb" cx="${x.toFixed(1)}" cy="${(y+2).toFixed(1)}" r="2.8" data-c="${col}" fill="#0b2a1a" stroke="#4c6b58" stroke-width=".6"/></g>`;
      }
    });
    $("wires").innerHTML = wires; $("bulbs").innerHTML = bulbs;
  })();
  // spots for ornaments (even) and candy canes (odd)
  const SPOTS = (function(){
    const r = rng(1225), out = [];
    for(let tries=0; tries<6000 && out.length<84; tries++){
      const x = 70 + r()*200, y = 34 + r()*146;
      if(!inside(x,y,9)) continue;
      if(out.some(([a,b]) => Math.hypot(a-x,b-y) < 12.5)) continue;
      if(bulbPts.some(([a,b]) => Math.hypot(a-x,b-y-2) < 7)) continue;
      out.push([x,y]);
    }
    return out;
  })();
  const ORN_SPOTS = SPOTS.filter((_,i)=>i%2===0), CANE_SPOTS = SPOTS.filter((_,i)=>i%2===1);
  const ORN_COLORS = ["#e23a4f","#f2c14e","#4c9be8","#e8e8f0","#b06ad9","#ff8a3d"];
  const PRES_SLOTS = [[158,216,26,18],[186,216,22,15],[132,217,22,16],[214,217,24,19],[132,206,20,15],[208,206,22,14],[104,218,20,14],[242,218,22,16],[106,207,18,15],[236,207,20,17],[78,219,20,15],[268,219,20,13],[82,208,18,13],[262,208,18,14],[54,220,18,14],[290,220,18,15]];
  const PRES_COLORS = [["#d5122f","#f2c14e"],["#2f6dc2","#ffffff"],["#f2c14e","#d5122f"],["#8e44ad","#f2c14e"],["#ffffff","#d5122f"],["#1d8a4a","#ffd23f"]];
  let prev = null, treeKey = "";
  const COAL_SPOTS = [[120,224],[220,225],[146,226],[194,226],[96,224],[246,224],[172,227],[70,223],[272,223]];
  const lump = (x,y,sz) => { const k = sz/10;
    const pts = [[-10,0],[-8,-6],[-3,-9],[4,-8],[9,-4],[10,0]].map(([a,b]) => `${(x+a*k).toFixed(1)},${(y+b*k).toFixed(1)}`).join(" ");
    return `<polygon points="${pts}" fill="#1b1b1f" stroke="#000" stroke-width=".6"/><polygon points="${(x-3*k).toFixed(1)},${(y-9*k).toFixed(1)} ${(x+4*k).toFixed(1)},${(y-8*k).toFixed(1)} ${(x+1*k).toFixed(1)},${(y-4*k).toFixed(1)} ${(x-5*k).toFixed(1)},${(y-5*k).toFixed(1)}" fill="#4a4a52"/><circle cx="${(x+5*k).toFixed(1)}" cy="${(y-4*k).toFixed(1)}" r="${(0.9*k).toFixed(1)}" fill="#8a8a96"/>`; };
  let prevCoal = null;
  function drawCoal(c){
    const was = prevCoal === null ? c : prevCoal;
    $("coal").innerHTML = COAL_SPOTS.slice(0, c).map(([x,y],i) => `<g class="coal${i>=was?" new":""}">${lump(x,y,11)}</g>`).join("");
    prevCoal = c;
  }
  function drawTree(o, r, w, lit){
    const key = [o,r,w,lit].join(",");
    if(key === treeKey) return;
    treeKey = key;
    const was = prev || {o, r, w};
    let s = "";
    ORN_SPOTS.slice(0, o).forEach(([x,y],i) => {
      const c = ORN_COLORS[i % ORN_COLORS.length];
      s += `<g class="orn${i>=was.o?" new":""}"><line x1="${x}" y1="${y-9}" x2="${x}" y2="${y-5}" stroke="#0c3320" stroke-width=".7"/><rect x="${x-1.6}" y="${y-6.6}" width="3.2" height="2.2" rx=".6" fill="#cfcfcf"/><circle cx="${x}" cy="${y}" r="5" fill="${c}"/><circle cx="${x-1.7}" cy="${y-1.7}" r="1.3" fill="#fff" opacity=".65"/></g>`;
    });
    $("orns").innerHTML = s; s = "";
    CANE_SPOTS.slice(0, r).forEach(([x,y],i) => {
      const flip = -1, d = `M${x-1.5*flip} ${y+8} V${y-1} a${2.6} ${2.6} 0 0 ${flip>0?1:0} ${5.2*flip} 0 v1.4`;
      s += `<g class="cane${i>=was.r?" new":""}"><path d="${d}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="3.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="url(#tcane)" stroke-width="2.5" stroke-linecap="round"/></g>`;
    });
    $("canes").innerHTML = s; s = "";
    const pres = PRES_SLOTS.slice(0, w).map((p,i) => [p,i]).sort((a,b) => a[0][1]-b[0][1]);
    pres.forEach(([[cx,bot,pw,ph],i]) => {
      const [box,rib] = PRES_COLORS[i % PRES_COLORS.length], x = cx-pw/2, y = bot-ph;
      s += `<g class="pres${i>=was.w?" new":""}"><rect x="${x}" y="${y}" width="${pw}" height="${ph}" rx="1.5" fill="${box}" stroke="rgba(0,0,0,.25)" stroke-width=".7"/><rect x="${cx-1.6}" y="${y}" width="3.2" height="${ph}" fill="${rib}"/><rect x="${x}" y="${y+ph*.38}" width="${pw}" height="2.6" fill="${rib}"/><ellipse cx="${cx-3.4}" cy="${y-1.6}" rx="3.6" ry="2.4" fill="${rib}"/><ellipse cx="${cx+3.4}" cy="${y-1.6}" rx="3.6" ry="2.4" fill="${rib}"/><circle cx="${cx}" cy="${y-.8}" r="1.6" fill="${rib}"/></g>`;
    });
    $("presents").innerHTML = s;
    tree.classList.toggle("lit", lit);
    tree.querySelectorAll(".bulb").forEach(b => b.setAttribute("fill", lit ? b.dataset.c : "#0b2a1a"));
    prev = {o, r, w};
  }

  function updateTop(){
    const nice = state.people.filter(p => !p.naughty), naughtyN = state.people.length - nice.length;
    const gifts = nice.flatMap(p => p.gifts);
    const n = k => gifts.filter(g => g[k]).length;
    const o = n("ordered"), r = n("received"), w = n("wrapped");
    const pct = gifts.length ? Math.round((o+r+w)/(gifts.length*3)*100) : 0;
    const peopleDone = nice.filter(isDone).length;
    $("pct").textContent = pct + "%";
    $("pgifts").textContent = `${gifts.length} gift${gifts.length===1?"":"s"}`;
    $("legend").innerHTML = `<span>${ICON.ordered(true)}${o} ordered</span><span>${ICON.received(true)}${r} received</span><span>${ICON.wrapped(true)}${w} wrapped</span>`;
    $("ppeople").textContent = `${peopleDone} of ${nice.length} people done` + (naughtyN ? ` · ${naughtyN} on the naughty list` : "");
    $("fill").style.width = pct + "%";
    $("bar").setAttribute("aria-valuenow", pct);
    $("bar").classList.toggle("full", pct === 100);
    if(!loaded) return;
    const lit = allDone();
    drawTree(o, r, w, lit);
    const coalN = state.people.filter(p => p.naughty).length;
    if(coalN !== prevCoal) drawCoal(coalN);
    const extra = Math.max(0, o-ORN_SPOTS.length) + Math.max(0, r-CANE_SPOTS.length) + Math.max(0, w-PRES_SLOTS.length);
    const pl = (k, a, b) => `${k} ${k===1?a:b}`;
    let msg;
    if(!state.people.length) msg = "Add someone to start your list.";
    else if(lit){
      const none = state.people.filter(p => !p.naughty && !p.gifts.length).map(p => p.name);
      msg = "Every gift is wrapped. The tree is lit!" + (none.length ? ` Still no gift ideas for ${none.join(", ")}.` : "");
    }
    else if(!gifts.length) msg = "Add gift ideas to start decorating the tree.";
    else msg = `${pl(o,"ornament","ornaments")}, ${pl(r,"candy cane","candy canes")} and ${pl(w,"present","presents")} so far. Wrap everything to light the tree.`;
    if(extra && !lit) msg += ` (The tree is full: ${extra} more not shown.)`;
    $("caption").textContent = msg;
  }

  const COAL_ICON = on => on
    ? `<svg viewBox="0 0 28 28"><polygon points="3,22 6,13 12,8 19,9 25,15 24,22" fill="#1b1b1f" stroke="#000" stroke-width=".8"/><polygon points="12,8 19,9 16,14 9,14" fill="#4a4a52"/><polygon points="19,9 25,15 20,16 16,14" fill="#35353c"/><circle cx="21" cy="12" r="1.1" fill="#9a9aa6"/><circle cx="8" cy="17" r=".8" fill="#9a9aa6"/></svg>`
    : `<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><polygon points="3,22 6,13 12,8 19,9 25,15 24,22"/><path d="M12 8 L9 14 L16 14 L19 9 M16 14 L20 16 L25 15" stroke-width="1.2" opacity=".7"/></svg>`;
  function card(p){
    const done = isDone(p) && !p.naughty;
    const got = p.gifts.filter(g=>g.wrapped).length;
    const items = p.gifts.length ? p.gifts.map(g => `
      <li class="gift ${g.wrapped?"got":""}">
        <div class="icons">${STEPS.map(([k,label]) =>
          `<button class="ib${justTapped===g.id+k?" just":""}" role="checkbox" aria-checked="${!!g[k]}" aria-label="${label}: ${esc(g.text)}" title="${label}" data-act="step" data-k="${k}" data-p="${p.id}" data-g="${g.id}">${ICON[k](!!g[k])}</button>`).join("")}</div>
        <span class="gtext">${esc(g.text)}</span>
        <button class="yearly" aria-pressed="${!!g.annual}" title="Gets this every year" data-act="annual" data-p="${p.id}" data-g="${g.id}">${g.annual?"Yearly":"Once"}</button>
        <button class="x" aria-label="Delete ${esc(g.text)}" data-act="delgift" data-p="${p.id}" data-g="${g.id}">×</button>
      </li>`).join("") : `<li class="empty">No gift ideas yet.</li>`;
    const rm = p.group === "others"
      ? (confirmRemove.has(p.id)
          ? `<div class="add" style="justify-content:flex-end"><button class="btn ghost" data-act="cancelrm" data-p="${p.id}">Keep</button><button class="btn red" data-act="rmperson" data-p="${p.id}">Remove ${esc(p.name)}</button></div>`
          : `<button class="rm" data-act="askrm" data-p="${p.id}">Remove ${esc(p.name)}</button>`)
      : "";
    return `<article class="card ${done?"done":""} ${p.naughty?"naughty":""}">
      <div class="chead">
        <span class="cname">${esc(p.name)}</span>
        ${p.naughty ? `<span class="pill naughty${justCoal===p.id?" coal-big":""}">${COAL_ICON(true)}Naughty</span>`
          : (p.gifts.length ? `<span class="count">${got}/${p.gifts.length} wrapped</span>` : "")}
        ${done ? `<span class="pill">Done</span>` : ""}
        <button class="coalbtn" aria-pressed="${!!p.naughty}" aria-label="${p.naughty?"Take "+esc(p.name)+" off the naughty list":"Put "+esc(p.name)+" on the naughty list"}" title="${p.naughty?"Back to nice":"Naughty list"}" data-act="coal" data-p="${p.id}">${COAL_ICON(!!p.naughty)}</button>
      </div>
      <ul>${items}</ul>
      <form class="add" data-p="${p.id}">
        <input id="add-${p.id}" type="text" placeholder="Add a gift for ${esc(p.name)}" aria-label="New gift for ${esc(p.name)}" autocomplete="off" enterkeyhint="done">
        <button class="btn" type="submit">Add</button>
      </form>
      ${rm}
    </article>`;
  }

  function render(){
    updateTop();
    if(!loaded) return;
    // keep drafts and focus across re-render
    const drafts = {};
    document.querySelectorAll(".add input,.addp input").forEach(i => drafts[i.id] = i.value);
    const focused = document.activeElement && document.activeElement.id;

    const fam = state.people.filter(p => p.group !== "others")
      .sort((a,b) => { const o = n => { const i = FAMILY_ORDER.indexOf(n); return i < 0 ? 99 : i; }; return o(a.name) - o(b.name); });
    const others = state.people.filter(p => p.group === "others");
    let html = "";
    if(fam.length) html += `<section class="section"><h2>Family</h2><div class="grid">${fam.map(card).join("")}</div></section>`;
    html += `<section class="section"><h2>Friends</h2>
      ${others.length ? `<div class="grid">${others.map(card).join("")}</div>` : ""}
      <form class="addp"><input id="addperson" type="text" placeholder="Add a friend" aria-label="New friend" autocomplete="off"><button class="btn red" type="submit">Add friend</button></form>
    </section>`;
    html += `<section class="reset">
      <div>Done for the year? Start next year's list: "Yearly" gifts stay and get unchecked, one-time gifts are cleared.</div>
      ${confirmReset
        ? `<div class="row"><button class="btn red" data-act="doreset">Yes, start next year</button><button class="btn ghost" data-act="cancelreset">Cancel</button></div>`
        : `<button class="btn ghost" data-act="askreset">Start next year's list</button>`}
    </section>`;
    $("lists").innerHTML = html;
    for(const id in drafts){ const el = $(id); if(el) el.value = drafts[id]; }
    if(focused && $(focused)) $(focused).focus();
  }

  // ---------- fun ----------
  let toastT;
  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 3200);
  }
  function celebrate(name, final){
    toast(final ? "Everything's wrapped! The tree is lit." : `${name}: all wrapped!`);
    if(!final){ tree.classList.remove("sway"); void tree.getBoundingClientRect(); tree.classList.add("sway"); setTimeout(()=>tree.classList.remove("sway"), 950); }
  }

  // ---------- actions ----------
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const act = b.dataset.act, p = b.dataset.p && find(b.dataset.p);
    if(act === "step" && p){
      justTapped = b.dataset.g + b.dataset.k; setTimeout(()=>{ justTapped = ""; }, 500);
      const g = p.gifts.find(x => x.id === b.dataset.g); if(!g) return;
      const was = isDone(p);
      const i = STEPS.findIndex(s => s[0] === b.dataset.k);
      if(g[b.dataset.k]) STEPS.slice(i).forEach(([k]) => g[k] = false);   // unchecking clears later steps
      else STEPS.slice(0, i+1).forEach(([k]) => g[k] = true);           // checking fills earlier steps
      g.done = !!g.wrapped;
      save();
      if(!was && isDone(p)) celebrate(p.name, allDone());
      else if(!was && allDone()) celebrate(p.name, true);
      render();
    } else if(act === "coal" && p){
      p.naughty = !p.naughty; justCoal = p.naughty ? p.id : ""; setTimeout(()=>{ justCoal = ""; }, 700);
      save(); render();
      toast(p.naughty ? `${p.name} is on the naughty list!` : `${p.name} is back on the nice list.`);
    } else if(act === "annual" && p){
      const g = p.gifts.find(x => x.id === b.dataset.g); if(!g) return;
      g.annual = !g.annual; save(); render();
    } else if(act === "delgift" && p){
      p.gifts = p.gifts.filter(x => x.id !== b.dataset.g); save(); render();
    } else if(act === "askrm"){ confirmRemove.add(b.dataset.p); render(); }
    else if(act === "cancelrm"){ confirmRemove.delete(b.dataset.p); render(); }
    else if(act === "rmperson"){ state.people = state.people.filter(x => x.id !== b.dataset.p); confirmRemove.delete(b.dataset.p); save(); render(); }
    else if(act === "askreset"){ confirmReset = true; render(); }
    else if(act === "cancelreset"){ confirmReset = false; render(); }
    else if(act === "doreset"){
      state.people.forEach(pp => { pp.naughty = false; pp.gifts = pp.gifts.filter(g => g.annual).map(g => ({...g, done:false, ordered:false, received:false, wrapped:false})); });
      confirmReset = false; save(); render(); toast("Fresh list. The cookies are back on the plate.");
    }
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target;
    const input = f.querySelector("input"); const text = input.value.trim(); if(!text) return;
    if(f.classList.contains("addp")){
      state.people.push({id:uid(), name:text, group:"others", gifts:[]});
    } else {
      const p = find(f.dataset.p); if(!p) return;
      p.gifts.push({id:uid(), text, done:false, ordered:false, received:false, wrapped:false, annual:false});
    }
    input.value = "";
    save(); render();
    const again = f.classList.contains("addp") ? $("addperson") : $("add-"+f.dataset.p);
    if(again) again.focus();
